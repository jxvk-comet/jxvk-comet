<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070F"/>
      <stop offset="0.55" stop-color="#151230"/>
      <stop offset="1" stop-color="#2B1550"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9B8FF"/>
    </linearGradient>
    <style>
      .t{font-family:'SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <!-- light blobs behind the glass -->
  <circle cx="260" cy="120" r="150" fill="#6E4BFF" opacity="0.55" filter="url(#soft)"/>
  <circle cx="980" cy="300" r="170" fill="#FF6A3D" opacity="0.40" filter="url(#soft)"/>
  <circle cx="720" cy="80" r="110" fill="#2FA7FF" opacity="0.35" filter="url(#soft)"/>
  <!-- the comet -->
  <path d="M 980 70 L 1110 30" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <circle cx="975" cy="72" r="6" fill="#FFFFFF"/>
  <!-- glass card -->
  <rect x="120" y="96" width="960" height="228" rx="44" fill="#FFFFFF" fill-opacity="0.07" stroke="url(#rim)" stroke-width="1.6"/>
  <text x="600" y="212" text-anchor="middle" class="t" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">CometOS</text>
  <text x="600" y="262" text-anchor="middle" class="t" font-size="26" font-weight="500" fill="#FFFFFF" fill-opacity="0.72">The Liquid Glass launcher for Android</text>
  <rect x="510" y="282" width="180" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="600" y="303" text-anchor="middle" class="t" font-size="15" font-weight="600" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.85">VERSION 7 · BETA</text>
</svg>
